{{ define "bodyClass" }}body-page{{ end }}
{{ define "main" }}
<article class="page h-entry">
  <header class="page-header">
    {{ with .Title }}<h1 class="page-title p-name">{{ . | htmlUnescape }}</h1>{{ end }}
  </header>

  <div class="body e-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
