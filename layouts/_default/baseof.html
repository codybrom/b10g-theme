<!doctype html>
<html lang="{{ .Site.Language.Lang | default "en" }}"{{ with .Site.Params.social_api_base }} data-social-api-base="{{ . }}"{{ end }} data-social-cache="{{ .Site.Params.comments_cache | default 60 }}">
{{ partial "head.html" . }}
<body>
  {{ partial "navbar.html" . }}

  <main class="{{ block "bodyClass" . }}body-page{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{/* Renders nothing unless the author has opted in on this browser with ?edit=1 */}}
  {{ if .Site.Params.edit_links | default true }}
    <script type="module" src="{{ "assets/js/edit-link.js" | relURL }}?{{ .Site.Params.theme_seconds }}"></script>
  {{ end }}
</body>
</html>
